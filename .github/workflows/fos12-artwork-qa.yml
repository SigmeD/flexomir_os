name: Accepted Artwork and Order Spacing QA

on:
  pull_request:
    paths:
      - 'src/components/orders/ArtworkSource.tsx'
      - 'src/components/orders/OrderItemForm.tsx'
      - 'src/components/orders/OrderComposer.tsx'
      - 'src/components/orders/artwork-source.css'
      - 'src/components/ui/local-file-control.tsx'
      - 'src/components/ui/page-header.tsx'
      - 'src/components/ui/page-header.css'
      - 'src/components/orders/order-compose.css'
      - 'src/components/orders/order-detail.css'
      - 'tests/fos12-artwork.spec.ts'
      - 'tests/fixtures/artwork-source.*'
      - 'playwright.fos12.config.ts'
      - 'tests/order-status-spacing.spec.ts'
      - 'tests/fos03-spacing.spec.ts'
      - 'playwright.order-spacing.config.ts'
      - 'package*.json'
      - '.github/workflows/fos12-artwork-qa.yml'
  workflow_dispatch:

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: FOS12 states, native choice, keyboard, responsive and accessibility
        run: npx playwright test --config=playwright.fos12.config.ts --workers=2
      - name: Accepted order status placement and Manager spacing in all consumers
        run: npx playwright test --config=playwright.order-spacing.config.ts --workers=2
      - name: Existing Layouts, Compose, Wave A and ButtonRoot regression
        run: npx playwright test tests/m7-layouts.spec.ts tests/order-compose.spec.ts tests/next-scope-a.spec.ts tests/button-system.spec.ts --workers=2 --reporter=line --output=output/playwright/fos12/regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fos12-artwork-evidence
          path: |
            output/playwright/fos12/**
            output/playwright/order-spacing/**
            output/order-spacing-results.json
          retention-days: 7
