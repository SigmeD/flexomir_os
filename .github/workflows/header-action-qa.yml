name: HeaderAction QA

on:
  pull_request:
    paths:
      - 'src/components/ui/header-action.*'
      - 'src/HeaderActionLab.*'
      - 'src/App.tsx'
      - 'tests/header-action.spec.ts'
      - '.github/workflows/header-action-qa.yml'
  workflow_dispatch:

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Browser for scoped component tests
        run: npx playwright install --with-deps chromium
      - name: HeaderAction E2E and responsiveness
        run: npx playwright test tests/header-action.spec.ts --project chromium-1440 --project chromium-390
      - name: Store failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: header-action-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
