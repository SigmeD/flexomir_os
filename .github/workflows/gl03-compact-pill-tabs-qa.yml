name: GL-03 Compact Glass Pill Tabs HTML QA

on:
  pull_request:
    paths:
      - 'prototypes/GL03_Compact_Pill_Tabs_Candidate_2026-11-04.html'
      - 'docs/GL03_Compact_Pill_Tabs_Contract_2026-11-04.md'
      - 'tests/gl03-compact-pill-tabs.spec.ts'
      - '.github/workflows/gl03-compact-pill-tabs-qa.yml'
  workflow_dispatch:

jobs:
  prototype-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Existing React TypeScript and build integrity
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Isolated GL-03 HTML prototype QA
        run: npx playwright test tests/gl03-compact-pill-tabs.spec.ts --project chromium-1440 --project chromium-390
      - name: Review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl03-pill-tabs-html-qa
          path: |
            test-results/
            output/playwright/glass-select-theme/results.json
          if-no-files-found: warn
          retention-days: 7
