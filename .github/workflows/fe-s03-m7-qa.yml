name: FE-S03 M7 UI QA

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/m7-*.spec.ts'
      - 'tests/order-compose.spec.ts'
      - 'tests/fos03-spacing.spec.ts'
      - 'tests/neutral-actions.spec.ts'
      - 'tests/plus-surface-motion.spec.ts'
      - 'tests/button-system.spec.ts'
      - 'tests/fixtures/button-root.*'
      - 'tests/popup-dismissal.spec.ts'
      - 'tests/typography-contract.spec.ts'
      - 'tests/fos-select-popup.spec.ts'
      - 'tests/fixtures/fos-select.*'
      - 'tests/glass-select-api.spec.ts'
      - 'tests/fixtures/glass-select.*'
      - 'tests/fe11-*.spec.ts'
      - 'docs/FE11_MOTION_FROZEN_V0_2.json'
      - 'playwright*.ts'
      - 'package*.json'
      - '.github/workflows/fe-s03-m7-qa.yml'
  workflow_dispatch:

jobs:
  m7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test --config=playwright.m7.config.ts --workers=2
      - name: Popup lifecycle and frozen motion regression
        run: npx playwright test --config=playwright.popup-qa.config.ts --workers=1
      - name: Shared navigation and popup typography contract
        run: npx playwright test --config=playwright.profile.config.ts tests/typography-contract.spec.ts --workers=1 --output=output/playwright/navigation-typography/ci
      - name: FE11 popup rollout and form contracts
        run: npx playwright test --config=playwright.reaudit.config.ts --workers=1
      - name: FOS03 opt-in composition pilot and legacy consumers
        run: npx playwright test --config=playwright.fos03.config.ts --workers=2
      - name: FOS08/09 neutral action reference
        run: npx playwright test --config=playwright.neutral-actions.config.ts --workers=1
      - name: FOS08 Plus actual surface motion (Owner gate remains open)
        run: npx playwright test --config=playwright.plus-motion.config.ts --workers=1
      - name: Unified ButtonRoot and system action contracts
        run: npx playwright test --config=playwright.buttons.config.ts --workers=2
      - name: Save M7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-s03-m7-browser-evidence
          path: |
            output/playwright/plus-motion/**
            output/playwright/button-system/**
            output/fe-s03/results.json
            output/fe-s03/browser/**/fes03-*.png
            output/fe-s03/browser/**/error-context.md
            output/fe-s03/browser/**/trace.zip
            output/playwright/post-fe11/cross-browser.json
            output/playwright/post-fe11/cross-browser/**/error-context.md
            output/playwright/profile-settings/results.json
            output/playwright/fe11-reaudit/cross-browser.json
            output/playwright/fe11-reaudit/cross-browser/**/error-context.md
            output/playwright/fe11-reaudit/cross-browser/**/trace.zip
            output/playwright/navigation-typography/ci/**/error-context.md
            output/playwright/fos03/green/results.json
            output/playwright/fos03/green/artifacts/**/*.png
            output/playwright/fos03/green/artifacts/**/trace.zip
            output/playwright/fos08-09/results.json
            output/playwright/fos08-09/browser/**/*.png
            output/playwright/fos08-09/browser/**/trace.zip
            output/playwright/fos08-09/browser/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
