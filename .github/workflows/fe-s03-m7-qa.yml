name: FE-S03 M7 UI QA

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/m7-*.spec.ts'
      - 'tests/order-compose.spec.ts'
      - 'playwright*.ts'
      - 'package*.json'
      - '.github/workflows/fe-s03-m7-qa.yml'
  workflow_dispatch:

jobs:
  m7:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test --config=playwright.m7.config.ts --workers=2
      - name: Save M7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe-s03-m7-browser-evidence
          path: |
            output/fe-s03/results.json
            output/fe-s03/browser/**/fes03-*.png
            output/fe-s03/browser/**/error-context.md
            output/fe-s03/browser/**/trace.zip
          if-no-files-found: warn
          retention-days: 7
