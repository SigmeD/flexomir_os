name: Orders Core UI QA

on:
  push:
    branches:
      - feat/fe08-manager-orders-screen-gl03
      - feat/fe-s01-orders-core
      - feat/fe-s02-order-compose-flow
  pull_request:
    paths:
      - 'src/screens/manager-orders/**'
      - 'src/screens/client-orders/**'
      - 'src/demo/**'
      - 'src/assets/orders/**'
      - 'src/assets/fonts/**'
      - 'src/components/orders/**'
      - 'src/components/layouts/**'
      - 'src/components/layout/**'
      - 'src/components/ui/**'
      - 'src/OrdersComponentsLab.tsx'
      - 'src/App.tsx'
      - 'tests/manager-orders.spec.ts'
      - 'tests/client-orders.spec.ts'
      - 'tests/order-detail.spec.ts'
      - 'tests/order-compose.spec.ts'
      - 'tests/orders-components.spec.ts'
      - 'tests/orders-figma-parity.spec.ts'
      - 'tests/popup-dismissal.spec.ts'
      - 'tests/fe11-frozen-contract.spec.ts'
      - 'tests/fe11-popup-adapters.spec.ts'
      - 'tests/fe-debug-order-transitions.spec.ts'
      - 'docs/FE11_MOTION_FROZEN_V0_2.json'
      - 'tests/helpers/orders.ts'
      - 'playwright.orders.config.ts'
      - '.github/workflows/fe08-manager-orders-qa.yml'
  workflow_dispatch:

jobs:
  screen:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --ipc=host --init
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify matching preinstalled browser image
        run: |
          node -e "const version = require('@playwright/test/package.json').version; if (version !== '1.64.1') throw new Error('Update the pinned Playwright image to match ' + version); console.log('Playwright image matches ' + version)"
      - run: npm run build
      - run: npx playwright test tests/orders-components.spec.ts tests/orders-figma-parity.spec.ts tests/order-compose.spec.ts tests/client-orders.spec.ts tests/order-detail.spec.ts tests/manager-orders.spec.ts tests/navigation-drawer.spec.ts tests/glass-pill-tabs-react.spec.ts tests/gl03-compact-pill-tabs.spec.ts tests/sidebar-nav.spec.ts tests/header-action.spec.ts tests/popup-dismissal.spec.ts tests/fe11-frozen-contract.spec.ts tests/fe11-popup-adapters.spec.ts tests/fe-debug-order-transitions.spec.ts --workers=2
      - name: Save Orders Core visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orders-core-screen-captures
          path: |
            test-results/**/fe08-manager-orders-*.png
            test-results/**/fes01-*.png
            test-results/**/fes02-*.png
            output/fe-s02-parity/**/react-*.png
            output/playwright/glass-select-theme/results.json
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 7
