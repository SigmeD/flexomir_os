name: Communication and signed documents QA
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.comm-docs.config.ts'
      - 'package*.json'
      - '.github/workflows/comm-docs-qa.yml'
  workflow_dispatch:
jobs:
  communication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test --config=playwright.comm-docs.config.ts --workers=2
      - name: Frozen material and shared button contract
        run: npx playwright test tests/fe11-frozen-contract.spec.ts tests/button-system.spec.ts --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comm-docs-evidence
          path: output/comm-docs/**
          retention-days: 14
