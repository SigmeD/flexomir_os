name: GL-03 Compact Glass Pill Tabs React QA

on:
  pull_request:
    paths:
      - 'src/components/ui/glass-pill-tabs.*'
      - 'src/GlassPillTabsLab.*'
      - 'src/App.tsx'
      - 'tests/glass-pill-tabs-react.spec.ts'
      - '.github/workflows/gl03-react-pill-tabs-qa.yml'
  workflow_dispatch:

jobs:
  react-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: GlassPillTabs plus accepted SidebarNav and HeaderAction regression
        run: npx playwright test tests/glass-pill-tabs-react.spec.ts tests/sidebar-nav.spec.ts tests/header-action.spec.ts --project chromium-1440 --project chromium-390
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gl03-react-pill-tabs-qa
          path: |
            test-results/
            output/playwright/glass-select-theme/results.json
          if-no-files-found: warn
          retention-days: 7
