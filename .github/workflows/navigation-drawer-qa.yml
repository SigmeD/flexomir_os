name: NavigationDrawer GL-02B QA

on:
  pull_request:
    paths:
      - 'src/components/ui/navigation-drawer.*'
      - 'src/NavigationDrawerLab.*'
      - 'src/App.tsx'
      - 'tests/navigation-drawer.spec.ts'
      - '.github/workflows/navigation-drawer-qa.yml'
  workflow_dispatch:

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: NavigationDrawer and shared-component regression
        run: npx playwright test tests/navigation-drawer.spec.ts tests/sidebar-nav.spec.ts tests/header-action.spec.ts --project chromium-1440 --project chromium-390
      - name: QA screenshot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drawer-gl02b-visual-qa
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawer-gl02b-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
