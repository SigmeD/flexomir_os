name: NavigationDrawer GL-02B QA

on:
  pull_request:
    paths:
      - 'src/components/ui/navigation-drawer.*'
      - 'src/NavigationDrawerLab.*'
      - 'src/App.tsx'
      - 'src/components/ui/glass-pill-tabs.*'
      - 'tests/glass-pill-tabs-react.spec.ts'
      - 'tests/navigation-drawer.spec.ts'
      - '.github/workflows/navigation-drawer-qa.yml'
  workflow_dispatch:

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --ipc=host --init
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Verify matching preinstalled browser image
        run: |
          node -e "const version = require('@playwright/test/package.json').version; if (version !== '1.64.1') throw new Error('Update the pinned Playwright image to match ' + version); console.log('Playwright image matches ' + version)"
      - name: NavigationDrawer and shared-component regression
        run: npx playwright test tests/navigation-drawer.spec.ts tests/sidebar-nav.spec.ts tests/header-action.spec.ts tests/glass-pill-tabs-react.spec.ts --project chromium-1440 --project chromium-390
      - name: QA screenshot artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drawer-gl02b-visual-qa
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawer-gl02b-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
